# =========================================================================
# XianZhu S2B2C - Docker Compose cho Backend Microservices
# Lưu ý: Chạy Middleware trước (docker compose -f docker-compose-middleware.yml up -d)
# Chạy lệnh: docker compose -f docker-compose-backend.yml up -d
# =========================================================================

networks:
  xianzhu-net:
    name: xianzhu-net
    external: true

services:
  # =========================================================================
  # BACKEND MICROSERVICES (CHẠY FILE JAR TRONG builds/backend/)
  # =========================================================================
  gateway:
    image: eclipse-temurin:21-jre-alpine
    container_name: xianzhu-gateway
    restart: always
    ports:
      - "8888:8888"
    environment:
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=lilishop
      - REDIS_HOST=redis
      - REDIS_PASSWORD=lilishop
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=lilishop
    volumes:
      - ./backend:/app
    command: java -jar -Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m /app/gateway.jar
    networks:
      - xianzhu-net
    deploy:
      resources:
        limits:
          memory: 320M

  auth-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: xianzhu-auth-service
