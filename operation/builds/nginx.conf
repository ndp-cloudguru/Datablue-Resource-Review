events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # 1. Giao diện Buyer UI (Mặc định trang chủ)
        location / {
            root   /usr/share/nginx/html/buyer;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 2. Giao diện Buyer UI (/buyer/)
        location /buyer/ {
            alias  /usr/share/nginx/html/buyer/;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 3. Giao diện Seller UI (/seller/)
        location /seller/ {
            alias  /usr/share/nginx/html/seller/;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 4. Proxy API về Gateway Service
        location /api/ {
            proxy_pass http://gateway:8888/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
