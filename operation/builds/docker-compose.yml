  # =========================================================================
  # 3. FRONTEND UI SERVICE (NGINX)
  # =========================================================================
  buyer-ui:
    image: nginx:alpine
    container_name: builds-buyer-ui
    restart: always
    depends_on:
      - gateway
    ports:
      - "8080:80"
    volumes:
      - ./frontend/buyer:/usr/share/nginx/html/buyer:ro
      - ./frontend/seller:/usr/share/nginx/html/seller:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          memory: 64M
