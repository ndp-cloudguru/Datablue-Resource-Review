    command: java -jar -Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m /app/goods-service.jar
    deploy:
      resources:
        limits:
          memory: 320M

  order-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: builds-order-service
    restart: always
    depends_on:
      - gateway
    environment:
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
    volumes:
      - ./backend:/app
    command: java -jar -Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m /app/order-service.jar
    deploy:
      resources:
        limits:
          memory: 320M

  consumer:
    image: eclipse-temurin:21-jre-alpine
    container_name: builds-consumer
    restart: always
    depends_on:
      - rabbitmq
      - nacos
    environment:
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
    volumes:
      - ./backend:/app
    command: java -jar -Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m /app/consumer.jar
    deploy:
      resources:
        limits:
          memory: 320M

  xianzhu-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: builds-xianzhu-service
    restart: always
    depends_on:
      - gateway
    environment:
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
